<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon (onglet navigateur) + apple-touch-icon (écran d'accueil iOS)
         + manifest (écran d'accueil Android) → tout pointe sur le logo LG -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Polices décoratives pour le Studio photos (texte sur gâteaux) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Pacifico&family=Lobster&family=Playfair+Display:wght@700&family=Montserrat:wght@800&family=Satisfy&family=Bebas+Neue&family=Anton&family=Caveat:wght@700&family=Amiri:wght@700&family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@700&family=Cairo:wght@800&family=Tajawal:wght@700&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet" />
    <meta name="apple-mobile-web-app-title" content="Lily Gourmet" />
    <meta name="application-name" content="Lily Gourmet" />

    <!-- ============================================================
         VIEWPORT — la ligne critique pour le responsive mobile.
         Sans ça, Safari iOS rend la page en "mode desktop zoomé"
         (largeur virtuelle ~980px) et tous les breakpoints Tailwind
         md: lg: xl: se déclenchent comme si on était sur desktop.
         RÉSULTAT : panier + grille côte à côte sur iPhone, bottom bar cachée.
         ============================================================ -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Optimisations iOS Safari : empêche le zoom auto sur les inputs
         et permet d'utiliser toute la hauteur d'écran -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Couleur de la barre du navigateur (Chrome Android + Safari iOS récent)
         On utilise le crème de l'app pour un rendu cohérent -->
    <meta name="theme-color" content="#FAF6F0" />

    <title>Lily Gourmet — Pâtisserie</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- ============================================================
         FILET : L'ÉCRAN BLANC APRÈS UN DÉPLOIEMENT.
         « Le lien d'essai ne fonctionne plus » — page blanche (Layla,
         2026-09-20). Le téléphone gardait la page d'avant, qui réclame des
         fichiers renommés depuis : ils répondent 404, et RIEN ne s'affiche.

         ⚠️ Le garde qui existe déjà (`vite:preloadError`) ne couvre pas ce
         cas-là : il ne parle que des écrans chargés à la demande. Quand c'est
         le fichier PRINCIPAL qui manque, l'app ne démarre jamais — aucun code
         à nous ne tourne, donc personne pour s'en apercevoir. D'où ce bout de
         code dans la page elle-même.

         Si rien n'est affiché au bout de 12 secondes, on recharge UNE fois
         avec une adresse neuve (le `?lg=` contourne la page gardée en
         mémoire). Une seule fois par minute : une app vraiment cassée ne doit
         pas tourner en boucle — c'est ce qui était arrivé le 09/09, « le site
         saute, se remet et saute ».

         ⚠️ L'adresse est conservée telle quelle : le `?article=` d'un QR code
         voyage dedans, et le perdre renverrait le pâtissier à l'accueil.
         ============================================================ -->
    <script>
      // Le secours : on recharge avec une adresse neuve, au plus une fois par
      // minute. Une app vraiment cassée ne doit pas tourner en boucle — c'est
      // ce qui était arrivé le 09/09, « le site saute, se remet et saute ».
      //
      // ⚠️ LE GARDE-FOU EST DANS L'ADRESSE, PAS DANS LA MÉMOIRE (Layla,
      // 2026-09-22 : « page blanche sur Safari, ça marche sur Chrome »). Safari
      // en navigation privée REFUSE `sessionStorage` — le `catch` renvoyait
      // alors sans rien faire, et le filet ne servait à rien là où il servait
      // le plus. Le `?lg=` qu'on pose est lui-même l'horodatage : il survit au
      // rechargement, et il ne demande rien à personne.
      function lgSecours () {
        var u = new URL(window.location.href)
        var deja = Number(u.searchParams.get('lg') || 0)
        if (deja && Date.now() - deja < 60000) return
        try {
          var d = Number(sessionStorage.getItem('lg:secours') || 0)
          if (Date.now() - d < 60000) return
          sessionStorage.setItem('lg:secours', String(Date.now()))
        } catch (e) { /* navigation privée : l'adresse suffit */ }
        u.searchParams.set('lg', String(Date.now()))
        window.location.replace(u.toString())
      }

      // ⚠️ TOUT DE SUITE, PAS DANS DOUZE SECONDES. Quand un fichier de l'app
      // répond 404 — la page gardée en cache réclame un fichier déjà remplacé
      // par un déploiement — le navigateur le DIT immédiatement. On n'a aucune
      // raison de laisser quelqu'un devant un écran blanc le temps d'un
      // minuteur. L'écoute est en phase de capture : les erreurs de
      // chargement ne remontent pas autrement.
      window.addEventListener('error', function (e) {
        var t = e && e.target
        if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return
        lgSecours()
      }, true)

      // Et le minuteur reste, en dernier recours : un fichier qui arrive mais
      // ne démarre pas ne déclenche aucune erreur de chargement.
      setTimeout(function () {
        var r = document.getElementById('root')
        if (r && r.childElementCount > 0) return
        lgSecours()
      }, 12000)
    </script>
  </body>
</html>
