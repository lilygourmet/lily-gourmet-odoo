<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- ============================================================
         PAGE À PART (pas l'app interne).
         Le raccourci de l'écran d'accueil doit rouvrir l'ANNUAIRE.
         C'est pour ça que le manifeste et les icônes sont écrits ICI,
         dans le HTML : l'iPhone les lit au chargement de la page et
         ignore un manifeste remplacé après coup par du JavaScript.
         Avant ça, le raccourci enregistrait l'app (mot de passe, puis
         l'écran Tâches) au lieu de l'annuaire.
         ============================================================ -->
    <link rel="icon" type="image/png" href="/annuaire-icon-180.png" />
    <link rel="apple-touch-icon" href="/annuaire-icon-180.png" />
    <link rel="manifest" href="/annuaire.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Annuaire" />
    <meta name="application-name" content="Annuaire" />
    <meta name="theme-color" content="#16A34A" />
    <title>Annuaire — Lily Gourmet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/annuaire.jsx"></script>
  </body>
</html>
