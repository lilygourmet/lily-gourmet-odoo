<style>
:root{--bordeaux:#993556;--cream:#fcfbf8;--warm:#F4F0EA;--line:#e5d8c3;--ink:#1a0f0a;--soft:#4a3a30;--mute:#8a7a70;--ok:#27500A;--okbg:#EAF3DE;--or:#854F0B;--orbg:#FFF7E0}
*{box-sizing:border-box}body{margin:0;padding:14px 14px 120px;background:var(--cream);font-family:Geist,-apple-system,sans-serif;color:var(--ink)}
.wrap{max-width:600px;margin:0 auto}
h1{font-family:Fraunces;font-style:italic;font-weight:500;font-size:27px;margin:0 0 2px}
.sous{font-size:13px;color:var(--mute);margin:0 0 18px}
.bloc{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--bordeaux);margin:22px 0 8px;display:flex;align-items:center;gap:9px}
.bloc::after{content:'';flex:1;height:2px;background:var(--line)}
.base{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--bordeaux);border-radius:13px;padding:13px;margin-bottom:7px}
.base.ok{border-left-color:#cfe0b8;background:var(--okbg)}
.base .n{flex:1;font-size:17px;font-weight:700}
.base .q{font-size:19px;font-weight:800;color:var(--bordeaux)}
.base .v{border:none;background:var(--warm);color:var(--soft);padding:7px 11px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.grp{font-size:15px;font-weight:800;margin:14px 0 6px;color:var(--soft)}
.g{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:6px;cursor:pointer}
.g.sel{border-color:var(--bordeaux);background:#fdf4f7;box-shadow:0 0 0 1px var(--bordeaux)}
.g input{width:24px;height:24px;accent-color:var(--bordeaux);flex-shrink:0;pointer-events:none}
.g .t{flex:1;font-size:18px;font-weight:800}
.g .p{font-size:13px;font-weight:500;color:var(--soft)}
.g .q{font-size:18px;font-weight:800;color:var(--bordeaux)}
.g .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--orbg);color:var(--or)}
.pan{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--bordeaux);box-shadow:0 -6px 24px rgba(122,42,68,.13);max-height:72vh;overflow:auto}
.pan .in{max-width:600px;margin:0 auto;padding:12px 14px 18px}
.pan .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pan .h b{font-size:16px}.pan .h span{font-size:12.5px;color:var(--mute)}
.pan .h button{margin-left:auto;border:none;background:var(--warm);border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.ing{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px dashed #f0e8db;font-size:16px}
.ing:last-of-type{border:none}
.ing b{min-width:96px;font-size:17px}
.ing .lien{border:none;background:none;color:var(--bordeaux);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left;flex:1;padding:0}
.sc{margin:0 0 8px 34px;background:var(--warm);border-radius:11px;padding:9px 12px}
.sc .t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:4px}
.sc .r{display:flex;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px dashed #e6ddcd}
.sc .r:last-child{border:none}.sc .r b{min-width:86px}
.rien{text-align:center;color:var(--mute);padding:30px 0;font-size:14px}
</style></head><body><div class="wrap">

0.96,"unite":"kg","parfums":["Praliné Amandes caramélisées","Praliné Chocolaté"]},{"produit":"SM CD* Crème au beurre Vanille STK","qty":960,"unite":"g","parfums":["fraisier","Oréo","Vanille"]},{"produit":"SM Genoise Chocolat KG CD","qty":1.615,"unite":"kg","parfums":["Chocolat","Oréo","Praliné Chocolaté"]},{"produit":"SM CD* Crème au beurre Chocolat STK","qty":960,"unite":"g","parfums":["Chocolat"]},{"produit":"SM CD* Crème au beurre Citron","qty":0.96,"unite":"kg","parfums":["Citron"]},{"produit":"SM CD* Crème Citron","qty":0.41,"unite":"kg","parfums":["Citron"]},{"produit":"SM CD* Craquant","qty":0.49,"unite":"kg","parfums":["Chocolat","Praliné Chocolaté"]}]},{"template":"40x40 Cakedesign CD*","taille":"40×40","qtyBase":1,"parfums":["Praliné Amandes caramélisées"],"lignes":[{"produit":"SM CD* Crème au beurre Praliné","qty":1.84,"unite":"kg","parfums":["Praliné Amandes caramélisées"]},{"produit":"SM CD* Sirop imbibage kg","qty":1.6,"unite":"kg","parfums":["Praliné Amandes caramélisées"]},{"produit":"SM CD* Amandes Caramélisées","qty":0.7,"unite":"kg","parfums":["Praliné Amandes caramélisées"]}]}]};
const CASA={timeZone:'Africa/Casablanca'}
const dt=q=>new Date(String(q||'').replace(' ','T')+'Z')
const jourFr=q=>dt(q).toLocaleDateString('fr-FR',{...CASA,weekday:'long',day:'numeric',month:'long'})
const nb=v=>Number(v||0).toLocaleString('fr-FR',{maximumFractionDigits:2})
const norm=u=>String(u||'').toLowerCase().replace(/^units?$/,'u')
const enKg=(q,u)=>norm(u)==='g'?{q:q/1000,u:'kg'}:{q,u:norm(u)}
const prepa=n=>/^SM\b/i.test(String(n||''))
const propre=n=>String(n||'').replace(/^SM\s+CD\*\s*/i,'').replace(/^SM\s+/i,'').replace(/^MP-\s*/i,'').replace(/^C-\s*/i,'')
  .replace(/\s*\bKG\b\s*CD\b/i,'').replace(/\s*\bCD\*?\b\s*$/i,'').replace(/\s*\bkg\b\s*$/i,'').replace(/\s*\baccs\b/i,'').replace(/\s*\bSTK\b/i,'').trim()
const BASES=[/cr[eè]me au beurre nature/i,/craquant/i,/sirop/i]
const estBase=n=>BASES.some(r=>r.test(n))
const tailleT=n=>{const r=D.recettes[n]; if(!r)return null; if(norm(r.unite)==='g')return{q:r.qty/1000,u:'kg'}
  const m=String(r.unite).match(/\(([\d.,]+)\s*kg\)/i); if(m)return{q:r.qty*parseFloat(m[1].replace(',','.')),u:'kg'}; return{q:r.qty,u:norm(r.unite)}}
const stockDe=n=>{const s=D.stocks[n]; return s?Math.max(0,enKg(s.qty,s.unite).q):0}

document.getElementById('date').textContent = jourFr(new Date().toISOString())
const aFaire = D.ofs.filter(o=>!(o.stock&&o.stock.assez))
const gateaux = aFaire.filter(o=>o.taille)
const sel = new Set()

// besoins cumulés d'une liste de gâteaux (niveau 1)
function besoinsDe(list){
  const b={}
  for (const o of list) for (const r of (o.recette||[])) { const k=enKg(r.qty,r.unite); b[r.produit]=(b[r.produit]||0)+k.q }
  return b
}
// ce qu'il faut préparer en base (niveau 2), pour la sélection ou pour tout
function basesPour(list){
  const b=besoinsDe(list), out={}
  for (const [p,q] of Object.entries(b)) {
    if (!prepa(p)) continue
    if (estBase(p)) { out[p]=(out[p]||0)+q; continue }
    const r=D.recettes[p]; if(!r) continue
    const base=norm(r.unite)==='g'?r.qty/1000:r.qty; if(!base) continue
    const manque=Math.max(0,q-stockDe(p)); if(!manque) continue
    const f=manque/base
    for (const l of r.lignes) if (prepa(l.produit)&&estBase(l.produit)) { const k=enKg(l.qty*f,l.unite); out[l.produit]=(out[l.produit]||0)+k.q }
  }
  return out
}
function drawBases(){
  const src = sel.size ? gateaux.filter(o=>sel.has(o.name)) : aFaire
  const b = basesPour(src)
  const lignes = Object.entries(b).map(([p,q])=>{
    const stock=stockDe(p), t=tailleT(p), manque=Math.max(0,q-stock)
    const n = (t&&t.q)?Math.ceil(manque/t.q):0
    return { p, q, stock, manque, qty: n*((t&&t.q)||0), unite:(t&&t.u)||'kg', n }
  }).sort((a,b2)=>b2.manque-a.manque)
  document.getElementById('bases').innerHTML =
    '<div class="bloc">1 · Bases à préparer</div>' + (lignes.length ? lignes.map(x=>
      x.manque<=0.001
        ? '<div class="base ok"><span class="n">'+propre(x.p)+'</span><span class="q" style="color:var(--ok);font-size:14px">en stock ('+nb(x.stock)+' '+x.unite+')</span></div>'
        : '<div class="base"><span class="n">'+propre(x.p)+'</span><span class="q">'+nb(x.qty)+' '+x.unite+'</span>'
          +'<button class="v" onclick="voirBase(\''+x.p.replace(/'/g,"\\'")+'\','+x.qty+',\''+x.unite+'\')">recette</button></div>'
          +'<div id="b_'+btoa(unescape(encodeURIComponent(x.p))).replace(/=/g,'')+'"></div>'
    ).join('') : '<p class="rien">Rien à préparer en base.</p>')
}
function voirBase(p,qty,unite){
  const id='b_'+btoa(unescape(encodeURIComponent(p))).replace(/=/g,''), el=document.getElementById(id)
  if (el.innerHTML) { el.innerHTML=''; return }
  el.innerHTML = sousRecette(p, qty, unite)
}
function sousRecette(p, qty, unite){
  const r=D.recettes[p]; if(!r) return ''
  const base=norm(r.unite)==='g'?r.qty/1000:r.qty
  const meme = norm(norm(r.unite)==='g'?'kg':r.unite)===norm(unite) && base
  const f = meme ? qty/base : 1
  return '<div class="sc"><div class="t">'+propre(p)+' — '+(meme?'pour '+nb(qty)+' '+unite:'pour '+nb(r.qty)+' '+r.unite)+'</div>'
    + r.lignes.map(l=>{ let q=l.qty*f,u=l.unite; if(norm(u)==='g'&&q>=1000){q=q/1000;u='kg'}
        return '<div class="r"><b>'+nb(q)+' '+u+'</b><span>'+propre(l.produit)+'</span></div>' }).join('') + '</div>'
}
function drawGateaux(){
  const stock = gateaux.filter(o=>!o.scode), cmd = gateaux.filter(o=>o.scode)
  const bloc = (titre, list) => { if(!list.length) return ''
    const parf=[...new Set(list.map(o=>o.parfum||'—'))].sort()
    return '<div class="bloc">'+titre+'</div>' + parf.map(p=>'<div class="grp">'+p+'</div>' + list.filter(o=>(o.parfum||'—')===p).map(o=>
      '<label class="g'+(sel.has(o.name)?' sel':'')+'" onclick="pick(\''+o.name+'\')">'
      +'<input type="checkbox" '+(sel.has(o.name)?'checked':'')+'>'
      +'<span class="t">'+o.taille+' <span class="p">'+(o.parfum||'')+'</span></span>'
      + (o.enRetard?'<span class="tag">en retard</span>':'')
      +'<span class="q">×'+nb(o.qty)+'</span></label>').join('')).join('') }
  document.getElementById('gateaux').innerHTML =
    '<div class="bloc">2 · Gâteaux à faire</div>'
    + (stock.length?'<div class="grp" style="color:var(--mute);font-size:12.5px;font-weight:600">POUR LE STOCK</div>'+bloc('',stock).replace('<div class="bloc"></div>',''):'')
    + (cmd.length?'<div class="grp" style="color:var(--mute);font-size:12.5px;font-weight:600;margin-top:14px">POUR UNE COMMANDE</div>'+bloc('',cmd).replace('<div class="bloc"></div>',''):'')
}
function pick(name){ sel.has(name)?sel.delete(name):sel.add(name); drawGateaux(); drawBases(); drawPan() }
function drawPan(){
  const pan=document.getElementById('pan')
  if (!sel.size) { pan.style.display='none'; return }
  const list=gateaux.filter(o=>sel.has(o.name))
  const b=besoinsDe(list)
  const lignes=Object.entries(b).sort((a,c)=>c[1]-a[1])
  pan.style.display='block'
  document.getElementById('panin').innerHTML =
    '<div class="h"><b>Ma recette</b><span>pour '+list.map(o=>o.taille+' '+(o.parfum||'')+' ×'+nb(o.qty)).join(' + ')+'</span>'
    +'<button onclick="sel.clear();drawGateaux();drawBases();drawPan()">effacer</button></div>'
    + lignes.map(([p,q])=>{
        const u='kg', dispo=stockDe(p), assez=dispo>=q
        const id='s_'+btoa(unescape(encodeURIComponent(p))).replace(/=/g,'')
        return '<div class="ing"><b>'+nb(q)+' '+u+'</b>'
          + (prepa(p)&&D.recettes[p] ? '<button class="lien" onclick="toggleSc(\''+id+'\',\''+p.replace(/'/g,"\\'")+'\','+q+',\''+u+'\')">'+propre(p)+' ▾</button>'
                                     : '<span style="flex:1">'+propre(p)+'</span>')
          + (prepa(p)&&assez?'<span class="tag" style="background:var(--okbg);color:var(--ok)">en stock</span>':'')
          +'</div><div id="'+id+'"></div>' }).join('')
}
function toggleSc(id,p,q,u){ const el=document.getElementById(id); el.innerHTML = el.innerHTML ? '' : sousRecette(p,q,u) }
drawBases(); drawGateaux()
</script></body></html>
