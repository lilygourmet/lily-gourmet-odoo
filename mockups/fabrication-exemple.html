<style>
:root{--bordeaux:#993556;--cream:#fcfbf8;--warm:#F4F0EA;--line:#e5d8c3;--ink:#1a0f0a;--soft:#4a3a30;--mute:#8a7a70;--ok:#27500A;--okbg:#EAF3DE;--or:#854F0B;--orbg:#FFF7E0}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--cream);font-family:Geist,-apple-system,sans-serif;color:var(--ink)}
.wrap{max-width:620px;margin:0 auto}
h1{font-family:Fraunces;font-style:italic;font-weight:500;font-size:26px;margin:0 0 14px}
.seg{display:flex;gap:4px;padding:4px;background:var(--warm);border-radius:12px;margin-bottom:18px}
.seg button{flex:1;border:none;background:none;padding:13px 6px;font-size:15px;font-weight:600;border-radius:9px;color:var(--soft);font-family:inherit;cursor:pointer}
.seg button.on{background:var(--bordeaux);color:#fff}
.sec{font-size:20px;font-weight:800;margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.sec small{font-size:12px;font-weight:500;color:var(--mute)}
.sec::after{content:'';flex:1;height:2px;background:var(--line)}
.c{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:9px;overflow:hidden;box-shadow:0 2px 8px rgba(122,42,68,.05)}
.c.done{background:var(--okbg);opacity:.7}
.c-h{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.cb{width:26px;height:26px;accent-color:var(--bordeaux);flex-shrink:0}
.t1{font-size:23px;font-weight:800;line-height:1.15;flex:1;min-width:0}
.t2{font-size:11.5px;color:var(--mute);font-weight:500;margin-top:2px}
.q{font-size:24px;font-weight:800;color:var(--bordeaux);white-space:nowrap}
.c.done .t1,.c.done .q{text-decoration:line-through}
.rec{border-top:1px dashed var(--line);background:#fdfcfa;padding:8px 14px 11px;display:none}
.c.open .rec{display:block}
.rt{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin-bottom:3px}
.li{display:flex;align-items:center;gap:11px;padding:9px 2px;font-size:15px;border-bottom:1px dashed #f0e8db}
.li:last-child{border:none}.li b{min-width:88px}
.tg{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tg.st{background:var(--okbg);color:var(--ok)}.tg.mq{background:var(--orbg);color:var(--or)}
.sub{margin:2px 0 6px 0;padding:9px 12px;background:var(--warm);border:1px solid var(--line);border-radius:12px}
.sub .st{font-size:11px;font-weight:700;color:var(--soft);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
.sub .si{display:flex;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed #e8dfd0}
.sub .si:last-child{border:none}.sub .si b{min-width:82px}
.cb2{width:21px;height:21px;accent-color:var(--bordeaux);flex-shrink:0}
.sub .si{align-items:center}
.lien{background:none;border:none;font:inherit;font-size:15px;text-align:left;color:var(--bordeaux);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;flex:1}
.vide{text-align:center;color:var(--mute);padding:34px 0;font-size:14px}
.plus{width:100%;background:none;border:1px dashed var(--line);border-radius:12px;padding:11px;color:var(--mute);font-size:13px;font-family:inherit;cursor:pointer;margin-top:8px}
</style></head><body><div class="wrap">
<h1>À fabriquer</h1>

   +'<div style="flex:1;min-width:0"><div class="t1">'+t+'</div>'
   +'<div class="t2">'+(o.recette.length?'toucher pour la recette · ':'')+'à faire pour '+heure(o.quand)+'</div></div>'
   +'<div class="q">×'+nb(o.qty)+(o.unite==='u'?'':'<small style="font-size:13px"> '+o.unite+'</small>')+'</div></div>'
   + (o.recette.length ? '<div class="rec"><div class="rt">Il te faut</div>'
      + o.recette.map(r=>{ const d=r.stock&&r.stock.assez, ouvrable = prepa(r.produit) && D.recettes[r.produit]
         return '<div><div class="li"><b>'+nb(r.qty)+' '+r.unite+'</b>'
         + (ouvrable
             ? '<button class="lien" onclick="event.stopPropagation();ouvre(this,\''+r.produit.replace(/'/g,"\\'")+'\','+r.qty+',\''+r.unite+'\')">'+propre(r.produit)+' ▾</button>'
             : '<span style="flex:1">'+propre(r.produit)+'</span>')
         + (prepa(r.produit) ? (d?'<span class="tg st">en stock</span>':'<span class="tg mq">tournée à faire</span>') : '') + '</div><div class="slot"></div></div>' }).join('')
      +'</div>' : '')
   +'</div>'
}
const norm=u=>String(u||'').toLowerCase().replace(/^units?$/,'u')
// clic sur une préparation : sa recette. Les préparations qu'elle contient
// (ex. crème pâtissière dans la crème au beurre) sont à leur tour cochables et dépliables.
function ouvre(btn, nom, qty, unite){
  const slot = btn.closest('div').parentNode.querySelector('.slot')
  if (slot.innerHTML) { slot.innerHTML=''; return }
  const r = D.recettes[nom]; if (!r) return
  const base = norm(r.unite)==='g' ? r.qty/1000 : r.qty
  const uBase = norm(r.unite)==='g' ? 'kg' : r.unite
  const meme = norm(uBase)===norm(unite) && base
  const f = meme ? qty/base : 1
  slot.innerHTML = '<div class="sub"><div class="st">' + propre(nom) + ' — '
    + (meme ? 'recette pour ' + nb(qty) + ' ' + unite : 'recette pour ' + nb(r.qty) + ' ' + r.unite + ' (à adapter)') + '</div>'
    + r.lignes.map(l=>{ let q=l.qty*f, u=l.unite; if (norm(u)==='g' && q>=1000) { q=q/1000; u='kg' }
        const enfant = prepa(l.produit) && D.recettes[l.produit]
        const cle = l.produit
        return '<div><div class="si">'
          + (prepa(l.produit) ? '<input type="checkbox" class="cb2" ' + (fait[cle]?'checked':'') + ' onclick="event.stopPropagation()" onchange="fait[\'' + cle.replace(/'/g,"\\'") + '\']=this.checked">' : '<span style="width:21px"></span>')
          + '<b>'+nb(q)+' '+u+'</b>'
          + (enfant
              ? '<button class="lien" style="font-size:14px" onclick="event.stopPropagation();ouvre(this,\'' + l.produit.replace(/'/g,"\\'") + '\',' + q + ',\'' + u + '\')">' + propre(l.produit) + ' ▾</button>'
              : '<span>'+propre(l.produit)+'</span>')
          + (prepa(l.produit) ? '<span class="tg mq" style="margin-left:auto">à préparer</span>' : '')
          + '</div><div class="slot"></div></div>' }).join('')
    + '</div>'
}
function draw(){
  const auj=new Date().toLocaleDateString('sv-SE',CASA), lim=new Date(Date.now()+(jours-1)*864e5).toLocaleDateString('sv-SE',CASA)
  const dans = D.ofs.filter(o=>o.type==='prevision').filter(o=>{const j=jISO(o.quand);return j>=auj&&j<=lim})
  const aFaire = dans.filter(o=>!(o.stock&&o.stock.assez)), enStock = dans.filter(o=>o.stock&&o.stock.assez)
  const list = voirStock ? dans : aFaire
  const gateaux = list.filter(o=>o.taille), preps = list.filter(o=>!o.taille)
  const parfums = [...new Set(gateaux.map(o=>o.parfum||'Sans parfum'))].sort()
  let html = parfums.map(p=>{
    const l = gateaux.filter(o=>(o.parfum||'Sans parfum')===p)
    return '<div class="sec">'+p+' <small>'+l.length+' taille'+(l.length>1?'s':'')+' · même crème</small></div>' + l.map(o=>carte(o,true)).join('')
  }).join('')
  if (preps.length) html += '<div class="sec" style="font-size:17px">Tournées <small>lancées par le stock mini</small></div>' + preps.map(o=>carte(o,false)).join('')
  if (!html) html = '<p class="vide">Rien à fabriquer : tout est déjà en stock.</p>'
  if (enStock.length && !voirStock) html += '<button class="plus" onclick="voirStock=true;draw()">Voir les '+enStock.length+' déjà en stock (pas à refaire)</button>'
  if (voirStock) html += '<button class="plus" onclick="voirStock=false;draw()">Masquer ce qui est déjà en stock</button>'
  document.getElementById('out').innerHTML = html
}
function per(b,n){ jours=n; [...b.parentNode.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); draw() }
draw()
</script></body></html>
